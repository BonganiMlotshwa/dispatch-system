<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Warehouse Building -->
  <rect x="96" y="192" width="320" height="256" fill="#e0e0e0" stroke="#333" stroke-width="8"/>
  
  <!-- Roof -->
  <polygon points="256,64 64,192 448,192" fill="#4a6fa5" stroke="#333" stroke-width="8"/>
  
  <!-- Door -->
  <rect x="208" y="320" width="96" height="128" fill="#8b5a2b" stroke="#333" stroke-width="4"/>
  <rect x="240" y="384" width="8" height="16" fill="#ffd700" rx="4" ry="4"/>
  
  <!-- Windows -->
  <rect x="128" y="240" width="64" height="48" fill="#add8e6" stroke="#333" stroke-width="4"/>
  <rect x="320" y="240" width="64" height="48" fill="#add8e6" stroke="#333" stroke-width="4"/>
  
  <!-- Carton Box -->
  <g transform="translate(384, 384) scale(0.5) rotate(-15)">
    <rect x="-40" y="-40" width="80" height="80" fill="#d4a76a" stroke="#333" stroke-width="4"/>
    <line x1="-40" y1="-40" x2="40" y2="-40" stroke="#333" stroke-width="4"/>
    <line x1="-40" y1="-40" x2="-40" y2="40" stroke="#333" stroke-width="4"/>
    <line x1="40" y1="-40" x2="40" y2="40" stroke="#333" stroke-width="4"/>
    <line x1="-40" y1="40" x2="40" y2="40" stroke="#333" stroke-width="4"/>
    <rect x="-30" y="-10" width="60" height="20" fill="#ffffff"/>
    <rect x="-25" y="-5" width="50" height="10" fill="#000000"/>
  </g>
  
  <!-- Barcode Scanner Icon -->
  <g transform="translate(128, 384) scale(0.4)">
    <rect x="-30" y="-60" width="60" height="120" rx="10" ry="10" fill="#333"/>
    <rect x="-20" y="-50" width="40" height="30" fill="#add8e6"/>
    <rect x="-15" y="-10" width="30" height="60" fill="#666"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#ff0000" stroke-width="2"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#ff0000" stroke-width="2"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#ff0000" stroke-width="2"/>
  </g>
</svg>